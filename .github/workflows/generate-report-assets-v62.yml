name: Renderizar barras ROAD V62 (PNG)

on:
  push:
    branches:
      - feature/v62-mobile-checkup-email
    paths:
      - .github/workflows/generate-report-assets-v62.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Criar 13 barras com a paleta ROAD
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-checkup-bars.py
      - name: Publicar PNGs na ramificação
        run: |
          git config user.name "road-wealth-ci"
          git config user.email "road-wealth-ci@users.noreply.github.com"
          git add public/assets/checkup-bar-*.png
          git diff --cached --quiet || (git commit -m "V62: barras de diagnóstico em PNG para Outlook, Gmail e impressão" && git push origin HEAD:feature/v62-mobile-checkup-email)
