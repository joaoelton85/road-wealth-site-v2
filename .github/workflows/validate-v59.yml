name: Validar V59 (sem publicar)

on:
  push:
    branches:
      - feature/checkup-email-cloudflare
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes do envio
        run: npm test
      - name: Build Astro e verificações
        run: npm run build
      - name: Validar empacotamento Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
