name: Validar V60 (sem publicar)

on:
  push:
    branches:
      - feature/v60-checkup-diagnostico
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar motores de pontuação e envio
        run: npm test
      - name: Compilar Astro e verificar integridade
        run: npm run build
      - name: Verificar empacotamento Worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir .wrangler-v60
