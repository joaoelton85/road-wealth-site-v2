name: Gerar mandala matriz V65.6.4 (sem redução)
on:
  push:
    branches:
      - fix/v65-6-4-highlights-mandala-master
    paths:
      - scripts/build-mandala-master-v65-6-4.mjs

permissions:
  contents: write

jobs:
  master:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências e navegador
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Reconstruir matriz sem máscaras e conferir dimensões e fonte
        run: node scripts/build-mandala-master-v65-6-4.mjs
      - name: Registrar fonte vetorial e prévia PNG de 1254px, sem ativar no site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/road-mandala-master-1254.svg public/assets/road-mandala-master-1254.png
          if ! git diff --cached --quiet; then
            git commit -m "V65.6.4: reconstruir mandala master 1254×1254 para avaliação"
            git fetch origin fix/v65-6-4-highlights-mandala-master
            git rebase origin/fix/v65-6-4-highlights-mandala-master
            git push origin HEAD:fix/v65-6-4-highlights-mandala-master
          fi
