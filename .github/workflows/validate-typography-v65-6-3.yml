name: Validar V65.6.3 — Tipografia do topo e Destaques

on:
  push:
    branches:
      - fix/v65-6-3-header-highlights-typography
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-desktop-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline estável (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Checkout revisão
        uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e compilar baseline
        working-directory: baseline
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validar revisão e Worker sem publicar
        working-directory: candidate
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          npx wrangler deploy --dry-run --outdir .wrangler-v65-6-3
      - name: Preparar navegador e testes em 7 larguras
        working-directory: candidate
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verificar fontes antigas no desktop e mobile intacto
        working-directory: candidate
        run: |
          (cd ../baseline && npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/road-main-preview.log 2>&1) &
          (npm run preview -- --host 127.0.0.1 --port 4322 >/tmp/road-v65-6-3-preview.log 2>&1) &
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:4321/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4322/ >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/check-typography-v65-6-3.mjs
